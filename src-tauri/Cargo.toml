[package]
name = "argus"
version = "0.1.29"
description = "Agent-native terminal workspace for coding agents (Claude Code, agy, Codex)"
authors = ["Liang515"]
license = "MIT"
repository = "https://github.com/Liang515/argus"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "argus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tauri-plugin-dialog = "2.8.4"
dirs = "7.0.0"
notify = "9.0.0"
plist = "1.10.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
dunce = "1"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Console"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
flate2 = "1"
tar = "0.4"
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
