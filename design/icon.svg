      <stop offset="1" stop-color="#0d0f12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a594ff"/>
      <stop offset="1" stop-color="#7c6cf2"/>
